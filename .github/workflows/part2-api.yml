
name: RaceDay Part 2 API CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test RaceDay API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore Part2/RaceDayAPI.sln

      - name: Build RaceDay API
        run: dotnet build Part2/RaceDayAPI.sln --configuration Release --no-restore

      - name: Run All Unit Tests
        run: dotnet test Part2/RaceDayAPI.sln --configuration Release --no-build --logger "trx;LogFileName=RaceDayTests.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RaceDay-Test-Results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
