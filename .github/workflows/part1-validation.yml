name: RaceDay Part 1 Validation

on:
  push:
  pull_request:

jobs:
  validate-part1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: docs folder is missing."
            exit 1
          fi

      - name: Check ERD exists
        run: |
          if [ ! -f "docs/RaceDay_ERD.png" ]; then
            echo "ERROR: RaceDay_ERD.png is missing."
            exit 1
          fi

      - name: Check API endpoint plan exists
        run: |
          if [ ! -f "docs/API_Endpoint_Plan.md" ]; then
            echo "ERROR: API_Endpoint_Plan.md is missing."
            exit 1
          fi

      - name: Check SQL database script exists
        run: |
          if [ ! -f "docs/RaceDay_Database.sql" ]; then
            echo "ERROR: RaceDay_Database.sql is missing."
            exit 1
          fi

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing."
            exit 1
          fi

      - name: Validate SQL contains required tables
        run: |
          grep -qi "CREATE TABLE Role" docs/RaceDay_Database.sql
          grep -qi "CREATE TABLE AppUser" docs/RaceDay_Database.sql
          grep -qi "CREATE TABLE Event" docs/RaceDay_Database.sql
          grep -qi "CREATE TABLE Category" docs/RaceDay_Database.sql
          grep -qi "CREATE TABLE EventCategory" docs/RaceDay_Database.sql
          grep -qi "CREATE TABLE Enrolment" docs/RaceDay_Database.sql
          grep -qi "CREATE TABLE Result" docs/RaceDay_Database.sql

      - name: Validate SQL contains required constraints
        run: |
          grep -qi "PRIMARY KEY" docs/RaceDay_Database.sql
          grep -qi "FOREIGN KEY" docs/RaceDay_Database.sql
          grep -qi "NOT NULL" docs/RaceDay_Database.sql
          grep -qi "UNIQUE" docs/RaceDay_Database.sql
          grep -qi "DEFAULT" docs/RaceDay_Database.sql

      - name: Validate SQL seed data
        run: |
          grep -qi "INSERT INTO Role" docs/RaceDay_Database.sql
          grep -qi "INSERT INTO AppUser" docs/RaceDay_Database.sql
          grep -qi "INSERT INTO Event" docs/RaceDay_Database.sql
          grep -qi "INSERT INTO Category" docs/RaceDay_Database.sql
          grep -qi "INSERT INTO EventCategory" docs/RaceDay_Database.sql
          grep -qi "INSERT INTO Enrolment" docs/RaceDay_Database.sql
          grep -qi "INSERT INTO Result" docs/RaceDay_Database.sql

      - name: Validate API endpoint plan content
        run: |
          grep -qi "Authentication" docs/API_Endpoint_Plan.md
          grep -qi "profile" docs/API_Endpoint_Plan.md
          grep -qi "Events" docs/API_Endpoint_Plan.md
          grep -qi "Categories" docs/API_Endpoint_Plan.md
          grep -qi "Enrolment" docs/API_Endpoint_Plan.md
          grep -qi "Results" docs/API_Endpoint_Plan.md

      - name: Validate README sections
        run: |
          grep -qi "User Roles" README.md
          grep -qi "Database" README.md
          grep -qi "API Endpoint Plan" README.md
          grep -qi "CI/CD" README.md
          grep -qi "Video Presentation" README.md

      - name: RaceDay Part 1 validation successful
        run: |
          echo "All required RaceDay Part 1 files are present."
          echo "SQL schema validation passed."
          echo "SQL constraint validation passed."
          echo "SQL seed data validation passed."
          echo "API endpoint plan validation passed."
          echo "README validation passed."
          echo "RaceDay Part 1 repository validation completed successfully."
